services:
  db:
    image: postgres:16-alpine
    container_name: ottodot-db
    environment:
      POSTGRES_USER: ottodot
      POSTGRES_PASSWORD: ottodot
      POSTGRES_DB: ottodot
    # 5434 on the host, deliberately not 5432 or 5433, so this never collides
    # with another Postgres already running on the reviewer's machine.
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ottodot -d ottodot"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ottodot_pgdata:/var/lib/postgresql/data

volumes:
  ottodot_pgdata:
